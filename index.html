<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <div class="theme-toggle-container">
            <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
        <header class="app-header">
            <h1>Lotto Number Generator</h1>
            <p>Your lucky numbers are just a click away!</p>
        </header>
        <section class="lotto-controls">
            <button id="generate-btn" class="lotto-button">Generate Numbers</button>
        </section>
        <section id="lotto-display" class="lotto-display-container">
            <!-- Lotto balls will be inserted here by JavaScript -->
        </section>
        <section class="history-container">
            <h2>History</h2>
            <ul id="history-list" class="history-list">
                <!-- History of generated numbers will be here -->
            </ul>
        </section>
    </main>
    <script src="main.js" type="module"></script>
</body>
</html>
